# Nightly live-model integration tests.
#
# Calls REAL provider APIs to verify adapter correctness.
# Runs on a schedule (daily 03:00 UTC) and on manual dispatch.
# Individual provider blocks self-skip when their secret is absent.
#
# Required repository secrets (set any subset):
#   OPENAI_API_KEY, ANTHROPIC_API_KEY, GOOGLE_API_KEY, OLLAMA_HOST

name: Integration Tests

on:
  schedule:
    # 03:00 UTC daily — low-traffic window for API calls
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual trigger'
        required: false
        default: 'manual run'

permissions:
  contents: read

jobs:
  integration:
    name: Live provider tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun dependencies
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-integration-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-integration-

      - run: bun install --frozen-lockfile

      - name: Run integration tests
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          OLLAMA_HOST: ${{ secrets.OLLAMA_HOST }}
        run: bun run test:integration
