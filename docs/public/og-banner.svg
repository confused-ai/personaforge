<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="og-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#0a0c1a"/>
      <stop offset="55%"  stop-color="#11142b"/>
      <stop offset="100%" stop-color="#0d1130"/>
    </linearGradient>

    <linearGradient id="og-brand" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#F5893B"/>
      <stop offset="50%"  stop-color="#4C5BD4"/>
      <stop offset="100%" stop-color="#33409E"/>
    </linearGradient>

    <linearGradient id="og-wordmark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#F7A85C"/>
      <stop offset="55%"  stop-color="#8B97F5"/>
      <stop offset="100%" stop-color="#B9A6F2"/>
    </linearGradient>

    <radialGradient id="og-glow-orange" cx="22%" cy="38%" r="48%">
      <stop offset="0%"   stop-color="rgba(245,137,59,0.22)"/>
      <stop offset="100%" stop-color="rgba(245,137,59,0)"/>
    </radialGradient>

    <radialGradient id="og-glow-blue" cx="78%" cy="66%" r="42%">
      <stop offset="0%"   stop-color="rgba(76,91,212,0.20)"/>
      <stop offset="100%" stop-color="rgba(76,91,212,0)"/>
    </radialGradient>

    <linearGradient id="og-logo-sheen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <filter id="og-soft">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <!-- Dark background -->
  <rect width="1200" height="630" fill="url(#og-bg)"/>

  <!-- Ambient glow blobs -->
  <rect width="1200" height="630" fill="url(#og-glow-orange)"/>
  <rect width="1200" height="630" fill="url(#og-glow-blue)"/>

  <!-- Subtle grid lines -->
  <g stroke="rgba(255,255,255,0.03)" stroke-width="1">
    <line x1="0"    y1="210" x2="1200" y2="210"/>
    <line x1="0"    y1="420" x2="1200" y2="420"/>
    <line x1="300"  y1="0"   x2="300"  y2="630"/>
    <line x1="600"  y1="0"   x2="600"  y2="630"/>
    <line x1="900"  y1="0"   x2="900"  y2="630"/>
  </g>

  <!-- ── Polygon logo mark (scaled 128 → 200, placed top-left) ── -->
  <g transform="translate(96,212) scale(1.5625)">
    <!-- soft glow behind mark -->
    <polygon points="64,8 109.03,34 64,60 18.97,34" fill="#F5893B" filter="url(#og-soft)" opacity="0.35"/>
    <polygon points="64,8 109.03,34 64,60 18.97,34" fill="#F5893B"/>
    <polygon points="112.43,40 112.43,92 67.4,118 67.4,66" fill="#4C5BD4"/>
    <polygon points="15.57,40 60.6,66 60.6,118 15.57,92" fill="#33409E"/>
    <polygon points="64,8 109.03,34 64,60 18.97,34" fill="url(#og-logo-sheen)"/>
  </g>

  <!-- ── Text content ─────────────────────────────────── -->
  <!-- Wordmark -->
  <text x="338" y="284"
        font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="78" font-weight="800" letter-spacing="-3"
        fill="url(#og-wordmark)">personaforge</text>

  <!-- Tagline -->
  <text x="340" y="342"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="27" font-weight="400" letter-spacing="-0.5"
        fill="rgba(238,240,251,0.66)">
    Production AI Agents, Shipped in TypeScript
  </text>

  <!-- Divider line -->
  <line x1="340" y1="372" x2="884" y2="372"
        stroke="rgba(255,255,255,0.10)" stroke-width="1"/>

  <!-- Feature pills -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
     font-size="20" font-weight="600" fill="rgba(238,240,251,0.55)">
    <text x="340" y="412">100+ Tools</text>
    <text x="494" y="412" fill="rgba(238,240,251,0.2)">·</text>
    <text x="514" y="412">Multi-Agent</text>
    <text x="674" y="412" fill="rgba(238,240,251,0.2)">·</text>
    <text x="694" y="412">Circuit Breakers</text>
    <text x="888" y="412" fill="rgba(238,240,251,0.2)">·</text>
    <text x="908" y="412">OTLP Tracing</text>
  </g>

  <!-- npm badge -->
  <rect x="340" y="442" width="196" height="42" rx="10"
        fill="rgba(76,91,212,0.18)" stroke="rgba(76,91,212,0.45)"
        stroke-width="1"/>
  <text x="358" y="469"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="18" font-weight="700"
        fill="#A9B4F8">npm install personaforge</text>

  <!-- MIT badge -->
  <rect x="552" y="442" width="90" height="42" rx="10"
        fill="rgba(76,212,158,0.15)" stroke="rgba(76,212,158,0.32)"
        stroke-width="1"/>
  <text x="567" y="469"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="18" font-weight="700"
        fill="#67D9A6">MIT</text>

  <!-- TypeScript badge -->
  <rect x="658" y="442" width="130" height="42" rx="10"
        fill="rgba(76,91,212,0.16)" stroke="rgba(139,151,245,0.4)"
        stroke-width="1"/>
  <text x="675" y="469"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="18" font-weight="700"
        fill="#8B97F5">TypeScript</text>

  <!-- Bottom border accent (brand gradient) -->
  <rect x="0" y="618" width="1200" height="12" fill="url(#og-brand)" opacity="0.8"/>
</svg>
